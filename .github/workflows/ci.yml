name: CI

on:
  pull_request:
  push:
    branches: [main, claude/scrabble-tournament-site-01kdfp]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://scrabble:scrabble@localhost:5432/scrabble
      DIRECT_URL: postgresql://scrabble:scrabble@localhost:5432/scrabble
      SESSION_SECRET: ci-session-secret-must-be-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
